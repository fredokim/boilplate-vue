name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate-theme-scss
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:ai
      - run: npm run check:automation
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run build-storybook
      # The application did not boot at all while every other gate was green:
      # two modules declared a route named after their own directory, and
      # vue-router throws when a child shares a name with its ancestor. Unit
      # tests mount components directly and never build the router.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm audit --audit-level=moderate
